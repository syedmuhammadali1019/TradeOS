<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeOS - AI Mobile POS</title>
    <style>
        /* --- Global Reset & Golden Luxury Dark Theme (Setup 1 & 2) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0D0D0D; /* Obsidian Black Background */
            color: #FFFFFF; /* Soft White Text */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile Screen Container */
        .mobile-screen {
            width: 100%;
            max-width: 400px;
            background-color: #121212;
            border: 1px solid #222222;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 1. Top Navigation */
        .top-nav {
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #222222;
        }

        .top-nav h1 {
            color: #D4AF37; /* Muted Gold */
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #AAAAAA;
            font-size: 13px;
            margin-top: 4px;
        }

        /* 2. Main Action Area (Mic Button) */
        .action-area {
            text-align: center;
            padding: 15px 0;
        }

        .mic-button {
            background-color: #D4AF37; /* Muted Gold */
            color: #0D0D0D;
            font-size: 18px;
            font-weight: 700;
            padding: 16px 28px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .mic-button:hover {
            background-color: #E6C657;
            transform: scale(1.03);
        }

        /* Mic Button Recording State with Yellow Glowing Pulse Animation (Setup 2) */
        .mic-button.recording {
            background-color: #D4AF37 !important;
            color: #0D0D0D !important;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.8);
            animation: pulse-yellow 1.2s infinite;
        }

        @keyframes pulse-yellow {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.9); }
            70% { box-shadow: 0 0 0 24px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        .status-msg {
            color: #888888;
            font-size: 12px;
            margin-top: 10px;
        }

        /* 3. Real-Time Text Log Area */
        .log-area {
            background-color: #1A1A1A;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        #live-text {
            color: #CCCCCC;
            font-size: 14px;
            font-style: italic;
        }

        /* 4. Quick Summary Card */
        .summary-card {
            background-color: #181818;
            border: 1px solid #2A2A2A;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .summary-card h2 {
            font-size: 16px;
            color: #D4AF37;
            border-bottom: 1px solid #2A2A2A;
            padding-bottom: 8px;
        }

        .bill-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #DDDDDD;
        }

        .gold-text {
            color: #D4AF37;
            font-size: 16px;
        }

        /* 5. Clean Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-secondary {
            flex: 1;
            background-color: #222222;
            color: #FFFFFF;
            border: 1px solid #444444;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-secondary:hover {
            background-color: #333333;
        }

        .btn-primary {
            flex: 1;
            background-color: #D4AF37;
            color: #0D0D0D;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #E6C657;
        }
    </style>
</head>
<body>

    <div class="mobile-screen">
        <!-- Top Navigation -->
        <div class="top-nav">
            <h1>TradeOS</h1>
            <div class="subtitle">Boliye aur Hisab Kijiye</div>
        </div>

        <!-- Main Action Area (Mic Button) -->
        <div class="action-area">
            <button id="micBtn" class="mic-button">🎙️ Tap to Speak</button>
            <div id="statusMsg" class="status-msg">Aawaz sun li gayi hai!</div>
        </div>

        <!-- Real-Time Text Log Area -->
        <div class="log-area">
            <p id="live-text">हां भाई पांच किलो वाला डाल दे</p>
        </div>

        <!-- Quick Summary Card (Updated by Setup 3 Parser) -->
        <div class="summary-card">
            <h2>Bill Summary</h2>
            <div class="bill-row">
                <span>Item Name:</span>
                <span id="itemName">--</span>
            </div>
            <div class="bill-row">
                <span>Quantity:</span>
                <span id="itemQty">--</span>
            </div>
            <div class="bill-row" style="font-weight: 700;">
                <span>Total Price:</span>
                <span id="totalPrice" class="gold-text">0 PKR</span>
            </div>
        </div>

        <!-- Clean Action Buttons -->
        <div class="action-buttons">
            <button id="newItemBtn" class="btn-secondary">➕ Naya Item Jodein</button>
            <button id="saveBtn" class="btn-primary">💾 Bill Save / Print</button>
        </div>
    </div>

    <!-- JavaScript: Web Speech API (Setup 2) + Smart Voice Parser Engine (Setup 3) -->
    <script>
        const micBtn = document.getElementById('micBtn');
        const statusMsg = document.getElementById('statusMsg');
        const liveText = document.getElementById('live-text');
        const newItemBtn = document.getElementById('newItemBtn');
        const saveBtn = document.getElementById('saveBtn');

        const itemNameElem = document.getElementById('itemName');
        const itemQtyElem = document.getElementById('itemQty');
        const totalPriceElem = document.getElementById('totalPrice');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isRecording = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ur-PK'; // Urdu / English mixed support

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                micBtn.textContent = 'Listening...';
                statusMsg.textContent = 'Sun raha hoon...';
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript;
                }
                liveText.textContent = transcript;
                
                // --- SETUP 3: SMART VOICE PARSER ENGINE ---
                parseVoiceInput(transcript);
            };

            recognition.onerror = (event) => {
                console.error('Speech error:', event.error);
                statusMsg.textContent = 'Error: ' + event.error;
                stopUI();
            };

            recognition.onend = () => {
                stopUI();
            };
        } else {
            statusMsg.textContent = 'Speech Recognition not supported in this browser.';
            micBtn.disabled = true;
        }

        // Smart Parser Function to extract Quantity and calculate amounts
        function parseVoiceInput(text) {
            let lowerText = text.toLowerCase();
            
            // Extract numbers (quantity or price) using regex
            let numbers = lowerText.match(/\d+/g);
            let qty = '--';
            let price = 0;

            if (numbers && numbers.length > 0) {
                qty = numbers[0] + ' kg / unit';
                // Dummy smart price calculation example (e.g., qty * 150 PKR per unit if price not explicitly stated)
                price = parseInt(numbers[0]) * 150; 
            }

            // Simple item detection keywords
            let detectedItem = 'General Item';
            if (lowerText.includes('chini') || lowerText.includes('चीनी')) detectedItem = 'Chini (Sugar)';
            else if (lowerText.includes('doodh') || lowerText.includes('दूध')) detectedItem = 'Doodh (Milk)';
            else if (lowerText.includes('daal') || lowerText.includes('दाल')) detectedItem = 'Daal';
            else if (lowerText.includes('chawal') || lowerText.includes('चावल')) detectedItem = 'Chawal (Rice)';
            else if (text.trim().length > 0) detectedItem = text.slice(0, 20) + '...';

            // Update UI with parsed values
            itemNameElem.textContent = detectedItem;
            itemQtyElem.textContent = qty;
            totalPriceElem.textContent = price + ' PKR';
        }

        function stopUI() {
            isRecording = false;
            micBtn.classList.remove('recording');
            micBtn.textContent = '🎙️ Tap to Speak';
            statusMsg.textContent = 'Aawaz sun li gayi hai!';
        }

        micBtn.addEventListener('click', () => {
            if (!recognition) return;
            if (isRecording) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    console.error(e);
                }
            }
        });

        newItemBtn.addEventListener('click', () => {
            liveText.textContent = 'Naya item shuru kiya gaya hai...';
            itemNameElem.textContent = '--';
            itemQtyElem.textContent = '--';
            totalPriceElem.textContent = '0 PKR';
        });

        saveBtn.addEventListener('click', () => {
            alert('Bill successfully saved / printed!');
        });
    </script>
</body>
</html>
