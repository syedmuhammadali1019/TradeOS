<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeOS - AI Mobile POS</title>
    <style>
        /* ==========================================
           ORIGINAL STEP 1: TRADEOS MOBILE LAYOUT CSS
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: #0b0f19;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 16px;
        }

        /* Top Header */
        .app-header {
            text-align: center;
            margin-bottom: 16px;
        }

        .app-title {
            font-size: 26px;
            font-weight: 800;
            color: #f3c653;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .app-subtitle {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
        }

        /* Main Action Area (Mic Button) */
        .main-action-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 14px;
        }

        .big-mic-btn {
            width: 100%;
            max-width: 260px;
            padding: 16px 20px;
            border-radius: 35px;
            border: none;
            background: linear-gradient(135deg, #f3c653, #d99b1a);
            color: #0b0f19;
            font-size: 17px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(243, 198, 83, 0.35);
            transition: all 0.3s ease;
        }

        .big-mic-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Recording Active State */
        .big-mic-btn.recording {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: #ffffff;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
            animation: pulse-red 1.2s infinite;
        }

        .mic-status-text {
            margin-top: 8px;
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }

        /* Real-time Text Log Area */
        .text-log-area {
            width: 100%;
            background-color: #161e2e;
            border: 1px solid #27354f;
            border-radius: 12px;
            padding: 12px;
            color: #f8fafc;
            font-size: 15px;
            line-height: 1.4;
            min-height: 100px;
            max-height: 120px;
            resize: none;
            outline: none;
            margin-bottom: 14px;
            direction: rtl;
            text-align: right;
        }

        .text-log-area:focus {
            border-color: #f3c653;
        }

        /* Quick Summary Card */
        .summary-card {
            background-color: #161e2e;
            border: 1px solid #27354f;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 14px;
        }

        .summary-card-title {
            font-size: 15px;
            font-weight: 700;
            color: #f3c653;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid #27354f;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
            color: #94a3b8;
        }

        .summary-row:last-child {
            margin-bottom: 0;
            padding-top: 4px;
            font-weight: 700;
            font-size: 15px;
            color: #f8fafc;
        }

        .summary-row span:last-child {
            color: #f8fafc;
            font-weight: 600;
        }

        .summary-row:last-child span:last-child {
            color: #f3c653;
            font-size: 17px;
        }

        /* Clean Action Buttons */
        .action-buttons-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-action {
            padding: 12px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.2s;
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background-color: #161e2e;
            color: #f8fafc;
            border: 1px solid #27354f;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f3c653, #d99b1a);
            color: #0b0f19;
            border: none;
            font-weight: 700;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            70% { box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header Section -->
    <header class="app-header">
        <h1 class="app-title">TradeOS</h1>
        <p class="app-subtitle">Boliye aur Hisab Kijiye</p>
    </header>

    <!-- Main Action Area: Step 2 Voice Engine UI -->
    <section class="main-action-area">
        <button class="big-mic-btn" id="micBtn" aria-label="Tap to Speak">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
            </svg>
            <span id="micBtnText">Tap to Speak</span>
        </button>
        <p class="mic-status-text" id="micHint">Aawaz sunne ke liye taiyar hai...</p>
    </section>

    <!-- Real-time Text Log Area (Urdu Spoken Words Live) -->
    <section>
        <textarea 
            id="voiceLogInput" 
            class="text-log-area" 
            placeholder="Yahan bola hua text aayega..."></textarea>
    </section>

    <!-- Quick Summary Card -->
    <section class="summary-card">
        <h3 class="summary-card-title">Bill Summary</h3>
        <div class="summary-row">
            <span>Item Name:</span>
            <span id="summaryItemName">--</span>
        </div>
        <div class="summary-row">
            <span>Quantity:</span>
            <span id="summaryQuantity">--</span>
        </div>
        <div class="summary-row">
            <span>Total Price:</span>
            <span id="summaryTotalPrice">0 PKR</span>
        </div>
    </section>

    <!-- Clean Action Buttons -->
    <footer class="action-buttons-bar">
        <button class="btn-action btn-secondary" id="newItemBtn">
            <span>➕</span> Naya Item Jodein
        </button>
        <button class="btn-action btn-primary" id="savePrintBtn">
            <span>💾</span> Bill Save / Print
        </button>
    </footer>
</div>

<!-- ==========================================
     STEP 2: VOICE ENGINE JAVASCRIPT INTEGRATION
     ========================================== -->
<script>
    const micBtn = document.getElementById('micBtn');
    const micBtnText = document.getElementById('micBtnText');
    const micHint = document.getElementById('micHint');
    const voiceLogInput = document.getElementById('voiceLogInput');
    const newItemBtn = document.getElementById('newItemBtn');
    const savePrintBtn = document.getElementById('savePrintBtn');

    const summaryItemName = document.getElementById('summaryItemName');
    const summaryQuantity = document.getElementById('summaryQuantity');
    const summaryTotalPrice = document.getElementById('summaryTotalPrice');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;
    let finalTranscript = '';

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'ur-PK'; // Urdu / English mixed support

        recognition.onstart = () => {
            isRecording = true;
            micBtn.classList.add('recording');
            micBtnText.textContent = 'Listening...';
            micHint.textContent = 'Aawaz sun li gayi hai! Bolte jayein...';
        };

        recognition.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                const transcript = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    finalTranscript += (finalTranscript ? ' ' : '') + transcript.trim();
                } else {
                    interimTranscript += transcript;
                }
            }
            voiceLogInput.value = finalTranscript + (interimTranscript ? ' ' + interimTranscript : '');
            voiceLogInput.scrollTop = voiceLogInput.scrollHeight;
        };

        recognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            micHint.textContent = 'Error: ' + event.error;
            stopRecordingUI();
        };

        recognition.onend = () => {
            stopRecordingUI();
        };
    } else {
        micHint.textContent = 'Browser speech not supported. Use Google Chrome.';
        micBtn.disabled = true;
        micBtn.style.opacity = '0.6';
    }

    function stopRecordingUI() {
        isRecording = false;
        micBtn.classList.remove('recording');
        micBtnText.textContent = 'Tap to Speak';
        micHint.textContent = 'Aawaz sunne ke liye taiyar hai...';
    }

    micBtn.addEventListener('click', () => {
        if (!recognition) return;

        if (isRecording) {
            recognition.stop();
        } else {
            finalTranscript = voiceLogInput.value.trim();
            try {
                recognition.start();
            } catch (e) {
                console.error(e);
            }
        }
    });

    newItemBtn.addEventListener('click', () => {
        finalTranscript = '';
        voiceLogInput.value = '';
        summaryItemName.textContent = '--';
        summaryQuantity.textContent = '--';
        summaryTotalPrice.textContent = '0 PKR';
        micHint.textContent = 'Naya item shuru kiya gaya hai.';
    });

    savePrintBtn.addEventListener('click', () => {
        if (!voiceLogInput.value.trim()) {
            alert('Pehle kuch bol kar bill mein item add karein!');
            return;
        }
        alert('Bill successfully saved / printed! (Agle step mein Smart Parser aayega)');
    });
</script>

</body>
</html>
