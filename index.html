<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TradeOS - AI Mobile POS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: #111827;
            border-radius: 24px;
            border: 1px solid #1f2937;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 680px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Top Header */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 800;
            color: #f59e0b;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 14px;
            color: #9ca3af;
        }

        /* Main Mic Action Area */
        .mic-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .mic-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #111827;
            border: none;
            border-radius: 40px;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
            transition: all 0.3s ease;
        }

        .mic-btn.recording {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
            transform: scale(1.03);
        }

        .mic-status-text {
            margin-top: 10px;
            font-size: 13px;
            color: #9ca3af;
            font-weight: 500;
            min-height: 18px;
        }

        /* Live Text Log Input Area */
        .text-input-container {
            margin-bottom: 20px;
        }

        .live-textarea {
            width: 100%;
            height: 90px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 14px;
            padding: 14px;
            color: #f8fafc;
            font-size: 16px;
            resize: none;
            outline: none;
            text-align: center;
            line-height: 1.4;
        }

        .live-textarea:focus {
            border-color: #f59e0b;
        }

        .live-textarea::placeholder {
            color: #6b7280;
        }

        /* Bill Summary Card */
        .summary-card {
            background-color: #161e2e;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .summary-title {
            font-size: 18px;
            font-weight: 700;
            color: #f59e0b;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #1f2937;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 15px;
            color: #d1d5db;
        }

        .summary-row:last-child {
            margin-bottom: 0;
            font-weight: 700;
            color: #f8fafc;
            font-size: 17px;
            margin-top: 4px;
        }

        .summary-row span:last-child {
            color: #f59e0b;
        }

        /* Bottom Clean Action Buttons */
        .bottom-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .action-btn {
            padding: 14px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #374151;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .action-btn:active {
            opacity: 0.8;
        }

        .btn-naya-item {
            background-color: #1f2937;
            color: #f8fafc;
        }

        .btn-save-print {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #111827;
            border: none;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <header class="header">
        <h1>TradeOS</h1>
        <p>Boliye aur Hisab Kijiye</p>
    </header>

    <!-- Main Mic Action Area -->
    <section class="mic-section">
        <button class="mic-btn" id="micBtn" aria-label="Tap to Speak">
            <span>🎙️</span> <span id="micBtnText">Tap to Speak</span>
        </button>
        <div class="mic-status-text" id="micStatusText">Mic ready hai, dabayein...</div>
    </section>

    <!-- Real-time Text Log Area -->
    <section class="text-input-container">
        <textarea 
            id="voiceLogInput" 
            class="live-textarea" 
            placeholder="Yahan bola hua text live aayega..."></textarea>
    </section>

    <!-- Quick Summary Card -->
    <section class="summary-card">
        <div class="summary-title">Bill Summary</div>
        <div class="summary-row">
            <span>Item Name:</span>
            <span id="summaryItem">--</span>
        </div>
        <div class="summary-row">
            <span>Quantity:</span>
            <span id="summaryQty">--</span>
        </div>
        <div class="summary-row">
            <span>Total Price:</span>
            <span id="summaryPrice">0 PKR</span>
        </div>
    </section>

    <!-- Bottom Clean Action Buttons -->
    <footer class="bottom-actions">
        <button class="action-btn btn-naya-item" id="nayaItemBtn">
            <span>➕</span> Naya Item Jodein
        </button>
        <button class="action-btn btn-save-print" id="savePrintBtn">
            <span>💾</span> Bill Save / Print
        </button>
    </footer>
</div>

<script>
    // DOM Elements
    const micBtn = document.getElementById('micBtn');
    const micBtnText = document.getElementById('micBtnText');
    const micStatusText = document.getElementById('micStatusText');
    const voiceLogInput = document.getElementById('voiceLogInput');
    const nayaItemBtn = document.getElementById('nayaItemBtn');
    const savePrintBtn = document.getElementById('savePrintBtn');

    // Web Speech API Integration Setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;
    let finalTranscript = '';

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'ur-PK'; // Supports Urdu / English mixed retail speech

        recognition.onstart = () => {
            isRecording = true;
            micBtn.classList.add('recording');
            micBtnText.textContent = 'Listening...';
            micStatusText.textContent = 'Aawaz sun li gayi hai!';
            micStatusText.style.color = '#ef4444';
        };

        recognition.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                const transcript = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    finalTranscript += (finalTranscript ? ' ' : '') + transcript.trim();
                } else {
                    interimTranscript += transcript;
                }
            }
            // Display live text in textarea
            voiceLogInput.value = finalTranscript + (interimTranscript ? ' ' + interimTranscript : '');
            voiceLogInput.scrollTop = voiceLogInput.scrollHeight;
        };

        recognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            micStatusText.textContent = 'Error: ' + event.error;
            stopRecordingUI();
        };

        recognition.onend = () => {
            stopRecordingUI();
        };
    } else {
        micStatusText.textContent = 'Browser Speech API supported nahi hai!';
        micBtn.disabled = true;
        micBtn.style.opacity = '0.5';
    }

    function stopRecordingUI() {
        isRecording = false;
        micBtn.classList.remove('recording');
        micBtnText.textContent = 'Tap to Speak';
        micStatusText.textContent = 'Mic ready hai, dabayein...';
        micStatusText.style.color = '#9ca3af';
    }

    // Mic Button Click Event with Error/State handling
    micBtn.addEventListener('click', () => {
        if (!recognition) return;

        if (isRecording) {
            recognition.stop();
        } else {
            finalTranscript = voiceLogInput.value.trim();
            try {
                recognition.start();
            } catch (e) {
                console.error(e);
            }
        }
    });

    // Naya Item Button functionality (Clears log for next item)
    nayaItemBtn.addEventListener('click', () => {
        finalTranscript = '';
        voiceLogInput.value = '';
        document.getElementById('summaryItem').textContent = '--';
        document.getElementById('summaryQty').textContent = '--';
        document.getElementById('summaryPrice').textContent = '0 PKR';
        micStatusText.textContent = 'Naya item bolne ke liye mic dabayein';
    });

    // Save / Print Button functionality
    savePrintBtn.addEventListener('click', () => {
        if (!voiceLogInput.value.trim()) {
            alert('Pehle kuch bol kar bill mein item add karein!');
            return;
        }
        alert('Bill successfully save / print ho gaya hai! (Next step: Smart Parser Engine)');
    });
</script>

</body>
</html>
